services:
  mongo-test:
    image: mongo:7.0
    ports:
      - "127.0.0.1:27018:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 2s
      timeout: 5s
      retries: 30

  tests:
    image: python:3.12-slim
    working_dir: /backend
    volumes:
      - ./backend:/backend:ro
    environment:
      TEST_MONGODB_URI: mongodb://mongo-test:27017
      PYTHONDONTWRITEBYTECODE: "1"
    depends_on:
      mongo-test:
        condition: service_healthy
    command: >-
      sh -c "pip install --no-cache-dir -r requirements-test.txt && python -m pytest -v -p no:cacheprovider"
